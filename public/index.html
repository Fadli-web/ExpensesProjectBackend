<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses Note Backend API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 36px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .endpoints {
      background: #0f172a;
      border-radius: 8px;
      padding: 16px;
      font-family: monospace;
      font-size: 13px;
    }
    .endpoint {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #1e293b;
    }
    .endpoint:last-child { border-bottom: none; }
    .method { color: #38bdf8; font-weight: bold; }
    .path { color: #cbd5e1; }
    .status { color: #34d399; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="dot"></span>
      API Operational
    </div>
    <h1>Expenses Note Backend</h1>
    <p>Serverless Functions powered by Supabase & Gemini AI Vision OCR are active and ready to handle frontend requests.</p>
    <div class="endpoints">
      <div class="endpoint">
        <span class="method">GET</span>
        <span class="path">/api/health</span>
        <span class="status">200 OK</span>
      </div>
      <div class="endpoint">
        <span class="method">POST</span>
        <span class="path">/api/receipts/scan</span>
        <span class="status">AI Vision</span>
      </div>
      <div class="endpoint">
        <span class="method">GET</span>
        <span class="path">/api/dashboard/summary</span>
        <span class="status">Analytics</span>
      </div>
      <div class="endpoint">
        <span class="method">GET</span>
        <span class="path">/api/receipts/gallery</span>
        <span class="status">Vault</span>
      </div>
    </div>
  </div>
</body>
</html>
